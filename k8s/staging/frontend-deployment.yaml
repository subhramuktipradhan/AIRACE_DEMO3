apiVersion: apps/v1
kind: Deployment

metadata:
  name: airace-frontend-dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: airace-frontend-dev

  template:
    metadata:
      labels:
        app: airace-frontend-dev

    spec:
      containers:
        - name: airace-frontend-dev

          image: subhramukti/airace-frontend:dev

          imagePullPolicy: Always

          ports:
            - containerPort: 80