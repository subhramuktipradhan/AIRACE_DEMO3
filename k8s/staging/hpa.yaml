apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: airace-dev-hpa

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: airace-dev

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource

      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 70